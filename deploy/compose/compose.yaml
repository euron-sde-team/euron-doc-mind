# ─────────────────────────────────────────────────────────────────────────────
# Euron DocMind: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 3110   api 8110   postgres 5451   valkey 6411   floci 4611
# ─────────────────────────────────────────────────────────────────────────────
name: docmind

x-app-env: &app-env
  # Development mode: the local stack talks to an emulator and links to localhost, both of
  # which production refuses on purpose (Settings.production_problems).
  APP_ENV: development
  TZ: UTC
  LOG_LEVEL: ${DOCMIND_LOG_LEVEL:-info}
  LOG_FORMAT: json
  PRODUCT_NAME: ${DOCMIND_PRODUCT_NAME:-Euron DocMind}
  DATABASE_URL: postgresql+asyncpg://docmind:docmind@postgres:5432/docmind
  REDIS_URL: redis://valkey:6379/0
  SESSION_SECRET: ${DOCMIND_SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${DOCMIND_API_KEY_PEPPER:?run `make env` first}
  CORS_ORIGINS: http://localhost:${DOCMIND_WEB_PORT:-3110},http://127.0.0.1:${DOCMIND_WEB_PORT:-3110}
  WEB_URL: http://localhost:${DOCMIND_WEB_PORT:-3110}
  API_URL: http://localhost:${DOCMIND_API_PORT:-8110}
  # Answers: "none" is the offline extractive answerer, no model needed. For a model, set
  # DOCMIND_LLM_PROVIDER=ollama (Ollama on this machine) or openai (any OpenAI-compatible
  # API) and DOCMIND_LLM_MODEL in .env.
  LLM_PROVIDER: ${DOCMIND_LLM_PROVIDER:-none}
  LLM_MODEL: ${DOCMIND_LLM_MODEL:-}
  LLM_BASE_URL: ${DOCMIND_LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${DOCMIND_LLM_API_KEY:-}
  OLLAMA_URL: ${DOCMIND_OLLAMA_URL:-http://host.docker.internal:11434}

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: docmind-api:local

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
    ports:
      - "127.0.0.1:${DOCMIND_PG_PORT:-5451}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Answer and embedding caches, rate limits and signed-out sessions. No eviction policy:
  # a revoked session must never be forgotten early.
  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${DOCMIND_REDIS_PORT:-6411}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    <<: *api-image
    environment:
      <<: *app-env
      MIGRATE_ON_BOOT: "true"
    ports:
      - "127.0.0.1:${DOCMIND_API_PORT:-8110}:8080"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Parses, chunks and embeds uploaded documents, taking them from the queue. The health
  # check reads the worker's metrics endpoint, so it reflects the worker process itself.
  worker:
    <<: *api-image
    command: ["python", "-m", "docmind.worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9100"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      # The API applies the migrations on boot; the worker starts once they are in.
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: docmind-web:local
    environment:
      # The browser calls the API directly, so this is the host-facing address.
      API_URL: http://localhost:${DOCMIND_API_PORT:-8110}
      PRODUCT_NAME: ${DOCMIND_PRODUCT_NAME:-Euron DocMind}
    ports:
      - "127.0.0.1:${DOCMIND_WEB_PORT:-3110}:8080"
    restart: unless-stopped

volumes:
  pgdata:
