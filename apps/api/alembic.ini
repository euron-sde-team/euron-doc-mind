# Alembic CLI configuration for development: `uv run alembic revision -m "..."`.
# The database URL always comes from DATABASE_URL (docmind.core.config), never from here.
# At runtime the app migrates programmatically (docmind.db.migrate) with the same scripts.
[alembic]
script_location = %(here)s/src/docmind/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
